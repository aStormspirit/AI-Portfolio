services:
  app:
    build: .
    container_name: ai-resume-editor
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MAX_PDF_SIZE_MB: ${MAX_PDF_SIZE_MB:-5}
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
