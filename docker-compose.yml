services:
  bot:
    build: .
    container_name: portfolio-rxresume-bot
    env_file:
      - .env
    environment:
      RXRESUME_BASE_URL: ${RXRESUME_BASE_URL:-https://rxresu.me/api/openapi}
      RXRESUME_AI_PROVIDER_ID: ${RXRESUME_AI_PROVIDER_ID:-}
      MAX_PDF_SIZE_MB: ${MAX_PDF_SIZE_MB:-15}
    volumes:
      - ./app:/app/app
    command: ["python", "-m", "app.bot"]
    restart: unless-stopped
