<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Resume Editor{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <meta
    name="htmx-config"
    content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true},{"code":"...","swap":false}]}'
  />
  <style>
    body {
      background:
        radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e2e8f0 0%, transparent 50%),
        #f8fafc;
      min-height: 100vh;
    }
    .htmx-request #spinner {
      display: inline-flex !important;
    }
    .htmx-request #submit-label {
      opacity: 0.7;
    }
    pre.preview {
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="text-slate-800 antialiased">
  <div class="mx-auto max-w-3xl px-4 py-10 sm:py-14">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
